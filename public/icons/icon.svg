<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Blue-to-dark-blue gradient (left half) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3bb4f2;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e7fd4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1258a8;stop-opacity:1"/>
    </linearGradient>
    <!-- Orange-to-red gradient (right half) -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#ff7700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e83c00;stop-opacity:1"/>
    </linearGradient>
    <!-- Dark navy circle gradient -->
    <radialGradient id="circleGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#1a4a8a;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#0a2050;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#061530;stop-opacity:1"/>
    </radialGradient>
    <!-- Lightning bolt gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe066;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#ffb800;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e07700;stop-opacity:1"/>
    </linearGradient>
    <!-- Pin shape clip path -->
    <clipPath id="pinClip">
      <path d="M256 32
        C168 32 96 104 96 192
        C96 290 220 430 248 460
        C252 465 260 465 264 460
        C292 430 416 290 416 192
        C416 104 344 32 256 32 Z"/>
    </clipPath>
    <!-- Left half clip -->
    <clipPath id="leftClip">
      <rect x="0" y="0" width="256" height="512"/>
    </clipPath>
    <!-- Right half clip -->
    <clipPath id="rightClip">
      <rect x="256" y="0" width="256" height="512"/>
    </clipPath>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00000044"/>
    </filter>
    <!-- Gloss highlight -->
    <radialGradient id="gloss" cx="35%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Drop shadow layer -->
  <ellipse cx="256" cy="488" rx="60" ry="12" fill="#00000022"/>

  <!-- Pin body — blue left half -->
  <path d="M256 32
    C168 32 96 104 96 192
    C96 290 220 430 248 460
    C252 465 256 468 256 468 Z"
    fill="url(#blueGrad)"
    filter="url(#shadow)"/>

  <!-- Pin body — orange right half -->
  <path d="M256 32
    C344 32 416 104 416 192
    C416 290 292 430 264 460
    C260 465 256 468 256 468 Z"
    fill="url(#orangeGrad)"
    filter="url(#shadow)"/>

  <!-- Dark navy outline ring -->
  <path d="M256 32
    C168 32 96 104 96 192
    C96 290 220 430 248 460
    C252 465 260 465 264 460
    C292 430 416 290 416 192
    C416 104 344 32 256 32 Z"
    fill="none"
    stroke="#0a1f44"
    stroke-width="6"
    opacity="0.7"/>

  <!-- Concentric rings background (glossy circle area) -->
  <circle cx="256" cy="195" r="110" fill="#0a2050" stroke="#1258a8" stroke-width="4"/>
  <circle cx="256" cy="195" r="104" fill="url(#circleGrad)"/>

  <!-- White ring separator -->
  <circle cx="256" cy="195" r="110" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.9"/>

  <!-- Inner circle edge glow -->
  <circle cx="256" cy="195" r="103" fill="none" stroke="#3399ff" stroke-width="3" opacity="0.5"/>

  <!-- Lightning bolt -->
  <path d="M280 108
    L225 200
    L258 200
    L232 290
    L295 188
    L260 188
    L305 108 Z"
    fill="url(#boltGrad)"
    stroke="#c06000"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- Lightning bolt inner highlight -->
  <path d="M278 116
    L232 196
    L254 196
    L237 272
    L284 198
    L256 198
    L296 116 Z"
    fill="#ffe88a"
    opacity="0.55"/>

  <!-- Gloss overlay on pin body -->
  <path d="M256 32
    C168 32 96 104 96 192
    C96 290 220 430 248 460
    C252 465 256 468 256 468 Z"
    fill="url(#gloss)"
    clip-path="url(#leftClip)"/>

  <path d="M256 32
    C344 32 416 104 416 192
    C416 290 292 430 264 460
    C260 465 256 468 256 468 Z"
    fill="url(#gloss)"
    clip-path="url(#rightClip)"/>

  <!-- Gloss highlight on circle -->
  <ellipse cx="228" cy="165" rx="32" ry="22" fill="#ffffff" opacity="0.18" transform="rotate(-20,228,165)"/>
</svg>
